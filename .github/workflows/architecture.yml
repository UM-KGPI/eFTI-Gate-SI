name: architecture

on:
  push:
    paths: ["architecture/**", ".github/workflows/architecture.yml"]
  pull_request:
    paths: ["architecture/**"]

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    env:
      STRUCTURIZR_CLI: "v2025.11.09"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Structurizr CLI
        run: |
          curl -sSL -o cli.zip "https://github.com/structurizr/cli/releases/download/${STRUCTURIZR_CLI}/structurizr-cli.zip"
          unzip -q cli.zip -d cli
      - name: Validate model
        run: ./cli/structurizr.sh validate -workspace architecture/workspace.dsl
      - name: Export views (PlantUML, Mermaid)
        run: |
          ./cli/structurizr.sh export -workspace architecture/workspace.dsl -format plantuml/c4plantuml -output out
          ./cli/structurizr.sh export -workspace architecture/workspace.dsl -format mermaid -output out
      - uses: actions/upload-artifact@v4
        with:
          name: c4-views
          path: out/
